services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aq_gis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aq_gis}
      POSTGRES_USER: ${POSTGRES_USER:-aq_gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aq_gis_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./data:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aq_gis} -d ${POSTGRES_DB:-aq_gis}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
